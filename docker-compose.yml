version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# CP-L-406-1 Digital Twin — Eclipse BaSyx v2 stack
#
# Serviços:
#   aas-env   : AAS Environment (armazena todos os shells e submodels)
#   aas-registry : AAS Registry (descoberta de shells)
#   sm-registry  : Submodel Registry (descoberta de submodels)
#   aas-web      : BaSyx AAS Web UI (visualização)
#
# Uso:
#   docker compose up -d
#   Depois: python3 upload_aas.py   (carrega os 15 arquivos JSON)
#   AAS Web UI: http://localhost:3000
#   AAS Env API: http://localhost:8081
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── AAS Environment ────────────────────────────────────────────────────────
  aas-env:
    image: eclipsebasyx/aas-environment:2.0.0-milestone-04
    container_name: cp-factory-aas-env
    ports:
      - "8081:8081"
    environment:
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION: "http://aas-registry:8082"
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION: "http://sm-registry:8083"
      BASYX_CORS_ALLOWEDORIGINS: "*"
      BASYX_CORS_ALLOWEDMETHODS: "GET,POST,PUT,DELETE,OPTIONS"
    volumes:
      - aas-env-data:/application/aasenv-filestorage
    networks:
      - basyx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/shells"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── AAS Registry ───────────────────────────────────────────────────────────
  aas-registry:
    image: eclipsebasyx/aas-registry-log-mongodb:2.0.0-milestone-04
    container_name: cp-factory-aas-registry
    ports:
      - "8082:8082"
    environment:
      BASYX_CORS_ALLOWEDORIGINS: "*"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/aas-registry"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - basyx-net
    restart: unless-stopped

  # ── Submodel Registry ──────────────────────────────────────────────────────
  sm-registry:
    image: eclipsebasyx/submodel-registry-log-mongodb:2.0.0-milestone-04
    container_name: cp-factory-sm-registry
    ports:
      - "8083:8083"
    environment:
      BASYX_CORS_ALLOWEDORIGINS: "*"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/sm-registry"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - basyx-net
    restart: unless-stopped

  # ── AAS Web UI ─────────────────────────────────────────────────────────────
  aas-web:
    image: eclipsebasyx/aas-gui:v2-240918
    container_name: cp-factory-aas-web
    ports:
      - "3000:3000"
    environment:
      AAS_REGISTRY_PATH: "http://localhost:8082/shell-descriptors"
      SUBMODEL_REGISTRY_PATH: "http://localhost:8083/submodel-descriptors"
      AAS_REPO_PATH: "http://localhost:8081/shells"
      SUBMODEL_REPO_PATH: "http://localhost:8081/submodels"
      CD_REPO_PATH: "http://localhost:8081/concept-descriptions"
    depends_on:
      aas-env:
        condition: service_healthy
    networks:
      - basyx-net
    restart: unless-stopped

  # ── MongoDB (persistência para registries) ─────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: cp-factory-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - basyx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  basyx-net:
    driver: bridge

volumes:
  aas-env-data:
  mongo-data:
